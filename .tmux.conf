# ─────────────────────────────────────────
#  Tmux config by @Trickhish ᓚᘏᗢ
#  https://github.com/Trickhish/my-configs
# ─────────────────────────────────────────


# ── Extended keys support ────────────────
  set -g allow-passthrough on
  set -g focus-events on
  set -g set-clipboard on
  set -s extended-keys on
  set -as terminal-features 'xterm*:extkeys


# ── True color support ───────────────────
  set -g default-terminal "tmux-256color"
  set -as terminal-features ",xterm-256color:RGB"
  set -as terminal-features ",tmux-256color:RGB"
  set -as terminal-overrides ",xterm-256color:Tc"



# ── Global Options ───────────────────────
  # Enable mouse
  set -g mouse on

  # Change prefix key (default is C-b)
  set -g prefix C-b

  # Window numbering base (default is 0)
  set -g base-index 1

  # Bigger scrollback
  set -g history-limit 5000

  # Wait briefly for the terminal to answer capability queries on attach
  # Prevents random chars appearing in the prompt when opening a new tmux session
  set -g assume-paste-time 1
  set -sg escape-time 50


  
# ── Global Styling ───────────────────────

  # Cursor style: block, underline, or bar
  set -g cursor-style underline
  set -g cursor-blink on
  
  # STATUS BAR
    set -g status-left "#[fg=#2E3440,bg=#81A1C1,bold] #S #[fg=#81A1C1,bg=#2E3440,nobold,noitalics,nounderscore]"
    #set -g status-right "%H:%M %d-%b-%y"
    set -g status-right "#{prefix_highlight}#[fg=#4C566A,bg=#2E3440,nobold,noitalics,nounderscore]#[fg=#D8DEE9,bg=#4C566A] %Y-%m-%d #[fg=#D8DEE9,bg=#4C566A,nobold,noitalics,nounderscore]#[fg=#D8DEE9,bg=#4C566A] %H:%M #[fg=#88C0D0,bg=#4C566A,nobold,noitalics,nounderscore]#[fg=#2E3440,bg=#88C0D0,bold] #H "


  
# ── Keybinds ────────────────────────────

  # Sessions
    bind r      command-prompt -p "Session name:" "rename-session '%%'"
    bind -n M-d detach
    bind C-x    kill-session

  # Panes ────────────────────────────────
    bind -n C-Left  select-pane -L
    bind -n C-Right select-pane -R
    bind -n C-Up    select-pane -U
    bind -n C-Down  select-pane -D
    bind -n C-x     kill-pane

  # Windows ──────────────────────────────
    bind -n M-c     new-window
    bind -n M-Left  previous-window
    bind -n M-Right next-window
    bind M-r        command-prompt -p "Window name:" "rename-window '%%'"
    bind -n M-x     kill-window

  # Splits ───────────────────────────────
    bind S-h split-window -h
    bind S-v split-window -v


  
# ── Nord Theme ──────────────────────────

  # Status bar: dark polar-night bg, snow-storm fg
  set -g status-style "bg=#2E3440,fg=#D8DEE9"
  
  # Pane borders: inactive = polar-night grey, active = frost blue
  set -g pane-border-style "bg=default,fg=#4C566A"
  set -g pane-active-border-style "bg=default,fg=#5E81AC"
  
  # display-panes (prefix+q) numbers
  set -g display-panes-colour "#4C566A"
  set -g display-panes-active-colour "#88C0D0"
  
  # Clock mode (prefix+t)
  setw -g clock-mode-colour "#88C0D0"
  
  # Messages / command prompt: elevated polar-night bg, frost cyan fg
  set -g message-style "bg=#3B4252,fg=#88C0D0"
  set -g message-command-style "bg=#3B4252,fg=#88C0D0"
  
  # Window list: inactive dim, active frost highlight
  setw -g window-status-style "bg=#2E3440,fg=#4C566A"
  setw -g window-status-current-style "bg=#2E3440,fg=#88C0D0,bold"
  setw -g window-status-activity-style "bg=#2E3440,fg=#EBCB8B"

  # Inactive window in the list
  set -g window-status-format "#[fg=#2E3440,bg=#4C566A,nobold,noitalics,nounderscore] #[fg=#D8DEE9,bg=#4C566A]#I #[fg=#D8DEE9,bg=#4C566A,nobold,noitalics,nounderscore] #[fg=#D8DEE9,bg=#4C566A]#W #F #[fg=#4C566A,bg=#2E3440,nobold,noitalics,nounderscore]"
  
  # Active window in the list (frost-cyan highlight)
  set -g window-status-current-format "#[fg=#2E3440,bg=#88C0D0,nobold,noitalics,nounderscore] #[fg=#2E3440,bg=#88C0D0]#I #[fg=#2E3440,bg=#88C0D0,nobold,noitalics,nounderscore] #[fg=#2E3440,bg=#88C0D0]#W #F #[fg=#88C0D0,bg=#2E3440,nobold,noitalics,nounderscore]"

  # prefix-highlight colors (when you press the tmux prefix)
  set -g @prefix_highlight_fg "#2E3440"
  set -g @prefix_highlight_bg "#8FBCBB"
